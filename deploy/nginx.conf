server {
    listen 80;
    server_name c2a.server.treer.fun;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name c2a.server.treer.fun;

    ssl_certificate /etc/nginx/ssl/server-wildcard/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/server-wildcard/server.treer.fun.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location = /admin {
        return 301 /admin/;
    }
    location = /admin.html {
        alias /www/wwwroot/c2a.server.treer.fun/admin.html;
    }
    location /admin/ {
        alias /www/wwwroot/c2a.server.treer.fun/;
        index admin.html;
    }

    location / {
        proxy_pass http://127.0.0.1:6011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    access_log /www/wwwlogs/c2a.server.treer.fun.log;
    error_log /www/wwwlogs/c2a.server.treer.fun.error.log;
}
